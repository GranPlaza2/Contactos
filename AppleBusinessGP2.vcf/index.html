<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Configuración básica de la página web -->
  <meta charset="UTF-8">
  <!-- Asegura que la página se adapte perfectamente a las pantallas de cualquier móvil -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardar Contacto</title>

  <!-- ESTILOS VISUALES (CSS): Definen el aspecto tipo Apple -->
  <style>
    /* Estilos generales de la pantalla */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; /* Tipografía nativa de iOS */
      background-color: #f5f5f7; /* Color de fondo gris claro */
      color: #1d1d1f;            /* Color de texto principal */
      display: flex; 
      justify-content: center;   /* Centra la tarjeta horizontalmente */
      align-items: center;       /* Centra la tarjeta verticalmente */
      min-height: 100vh;         /* Ocupa todo el alto de la pantalla del móvil */
      margin: 0; 
      padding: 20px; 
      box-sizing: border-box;
    }

    /* Estilo del cuadro blanco central (la tarjeta flotante) */
    .card {
      background: #ffffff; 
      padding: 32px 24px; 
      border-radius: 20px;       /* Bordes muy redondeados estilo iOS */
      box-shadow: 0 4px 24px rgba(0,0,0,0.08); /* Sombra suave para dar profundidad */
      text-align: center; 
      max-width: 320px; 
      width: 100%;
    }

    /* Estilo del botón azul de descarga */
    .btn {
      display: inline-block; 
      width: 100%; 
      padding: 14px 0;
      background-color: #0071e3; /* Azul */
      color: #ffffff; 
      text-decoration: none; 
      font-weight: 600; 
      font-size: 16px; 
      border-radius: 12px;       /* Bordes redondeados en el botón */
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- CONTENIDO VISIBLE DE LA PÁGINA -->
  <div class="card">
    <!-- Emoji o icono principal (se puede sustituir por una foto o logo con <img>) -->
    <div style="font-size: 40px; margin-bottom: 12px;">🪪</div>

    <!-- Título principal de la tienda -->
    <h1 style="font-size: 20px; margin: 0 0 8px 0;">Añadir Contacto</h1>

    <!-- Mensaje secundario informativo -->
    <p style="font-size: 14px; color: #86868b; margin: 0 0 20px 0;">Guardando contacto en tu agenda...</p>
    
    <!-- 
      ENLACE AL ARCHIVO .VCF REAL
      1. id="vcf-link": Sirve para que el script de abajo identifique este botón.
      2. href: Usa la CDN de jsDelivr para cargar el .vcf con el MIME-type correcto (text/vcard),
         lo que corrige el problema de Chrome en iOS.
      3. download: Fuerza al navegador a descargar/abrir el archivo en lugar de mostrar texto plano.
    -->
    <a id="vcf-link" href="https://cdn.jsdelivr.net/gh/USUARIO/REPOSO@main/AppleBusinessGP2original.vcf" class="btn" download>Guardar Contacto</a>
  </div>

  <!-- SCRIPT DE AUTOMATIZACIÓN (JavaScript) -->
  <script>
    // Se ejecuta automáticamente cuando la página web ha terminado de cargarse en el móvil
    window.addEventListener('DOMContentLoaded', () => {
      // Esperamos 200 milisegundos para dar tiempo al navegador (especialmente Chrome)
      // a pasar a primer plano y estabilizarse tras el escaneo NFC
      setTimeout(() => {
        // Simula un "clic" automático en el botón azul para abrir el contacto sin que el usuario tenga que tocar nada
        document.getElementById('vcf-link').click();
      }, 200);
    });
  </script>

</body>
</html>
